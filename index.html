<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ترک کانال‌های روبیکا</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Tahoma, Arial, sans-serif;
    background: #f1f4f9;
    color: #222;
}

.box {
    max-width: 420px;
    margin: 45px auto;
    padding: 25px;
    background: white;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 5px 20px #00000012;
}

h2 {
    color: #2879e8;
    font-size: 23px;
}

.total {
    margin: 25px 0;
    padding: 22px;
    background: #edf5ff;
    border-radius: 14px;
}

.number {
    font-size: 38px;
    font-weight: bold;
    color: #2879e8;
    margin-top: 10px;
}

button {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-size: 17px;
    font-family: inherit;
    cursor: pointer;
}

#start {
    background: #e53935;
    color: white;
}

#stop {
    background: #555;
    color: white;
    margin-top: 10px;
    display: none;
}

#message {
    margin: 22px 0;
    line-height: 2;
}

.progress-bg {
    height: 13px;
    background: #e5e5e5;
    border-radius: 20px;
    overflow: hidden;
    margin: 18px 0;
}

#progress {
    width: 0%;
    height: 100%;
    background: #24b36b;
    transition: width 0.3s;
}

.details {
    font-size: 14px;
    line-height: 2.2;
    color: #555;
}

#notice {
    margin-top: 15px;
    font-size: 13px;
    color: #777;
    line-height: 1.8;
}
</style>
</head>

<body>

<div class="box">

    <h2>مدیریت کانال‌های روبیکا</h2>

    <div class="total">
        تعداد کل کانال‌ها
        <div class="number" id="total">۰</div>
    </div>

    <button id="start" onclick="startLeaving()">
        🚀 شروع ترک کانال‌ها
    </button>

    <div id="message">
        برای شروع، دکمه بالا را بزنید.
    </div>

    <div class="progress-bg">
        <div id="progress"></div>
    </div>

    <div class="details">
        پیشرفت: <span id="done">۰</span>
        از <span id="all">۰</span>
        <br>
        درصد پیشرفت: <span id="percent">۰</span>٪
        <br>
        کانال‌های باقی‌مانده: <span id="remaining">۰</span>
    </div>

    <button id="stop" onclick="stopLeaving()">
        ⛔ توقف عملیات
    </button>

    <div id="notice">
        برای انجام عملیات، اتصال حساب روبیکا لازم است.
    </div>

</div>

<script>
const API = "https://rubika-cleaner-backend.onrender.com";

let totalChannels = 0;
let running = false;
let timer = null;

async function loadStatus() {
    try {
        const response = await fetch(API + "/api/channels/status");
        const data = await response.json();

        totalChannels = data.total_channels || 0;

        document.getElementById("total").textContent = totalChannels;
        document.getElementById("all").textContent = totalChannels;
        document.getElementById("remaining").textContent = totalChannels;

        document.getElementById("notice").textContent =
            data.message || "وضعیت اتصال دریافت شد.";

    } catch (error) {
        document.getElementById("notice").textContent =
            "اتصال به سرور برقرار نشد.";
    }
}

async function startLeaving() {
    if (running) return;

    if (totalChannels === 0) {
        document.getElementById("message").textContent =
            "هنوز فهرست کانال‌ها دریافت نشده است.";
        await loadStatus();
        return;
    }

    document.getElementById("message").textContent =
        "در حال آماده‌سازی عملیات...";

    try {
        const response = await fetch(API + "/api/channels/leave/start", {
            method: "POST"
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "عملیات شروع نشد.");
        }

        running = true;
        document.getElementById("start").disabled = true;
        document.getElementById("stop").style.display = "block";
        document.getElementById("message").textContent =
            "در حال ترک کانال‌ها، لطفاً تا انتها صبر کنید.";

        timer = setInterval(checkProgress, 1500);

    } catch (error) {
        document.getElementById("message").textContent =
            "عملیات هنوز در سرور فعال نشده است. ابتدا باید بخش ترک کانال به بک‌اند اضافه شود.";
    }
}

async function checkProgress() {
    try {
        const response = await fetch(API + "/api/channels/leave/status");
        const data = await response.json();

        const done = data.done || 0;
        const total = data.total || totalChannels;
        const percent = total > 0
            ? Math.min(100, Math.floor(done * 100 / total))
            : 0;

        document.getElementById("done").textContent = done;
        document.getElementById("all").textContent = total;
        document.getElementById("remaining").textContent =
            Math.max(0, total - done);
        document.getElementById("percent").textContent = percent;
        document.getElementById("progress").style.width = percent + "%";

        if (data.status === "completed") {
            finish("✅ ترک کانال‌ها تمام شد.");
        }
    } catch (error) {
        document.getElementById("message").textContent =
            "دریافت وضعیت عملیات با مشکل روبه‌رو شد.";
    }
}

async function stopLeaving() {
    try {
        await fetch(API + "/api/channels/leave/stop", {
            method: "POST"
        });

        finish("⛔ درخواست توقف ارسال شد.");
    } catch (error) {
        document.getElementById("message").textContent =
            "ارسال درخواست توقف ناموفق بود.";
    }
}

function finish(message) {
    running = false;

    if (timer) {
        clearInterval(timer);
        timer = null;
    }

    document.getElementById("message").textContent = message;
    document.getElementById("start").disabled = false;
    document.getElementById("stop").style.display = "none";
}

loadStatus();
</script>

</body>
  </html>
