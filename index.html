<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدیریت کانال‌های روبیکا</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #101827, #172d46);
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 430px;
    background: #1d2b40;
    padding: 28px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 10px 35px #0005;
}

.icon {
    font-size: 55px;
    margin-bottom: 10px;
}

h1 {
    font-size: 23px;
    margin-bottom: 12px;
}

p {
    color: #bdcbe0;
    line-height: 2;
    font-size: 14px;
}

.button {
    display: block;
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 15px;
    margin-top: 22px;
    background: #1689f8;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.button:disabled {
    opacity: 0.6;
}

#status {
    margin-top: 18px;
    font-size: 13px;
    color: #8fd9ff;
    line-height: 2;
    overflow-wrap: anywhere;
}

.note {
    font-size: 12px;
    color: #9aabc1;
    margin-top: 22px;
}
</style>
</head>

<body>
<main class="container">

    <div class="icon">🚀</div>

    <h1>مدیریت کانال‌های روبیکا</h1>

    <p>
        برای بررسی اتصال سرویس، دکمه زیر را بزنید.
    </p>

    <button class="button" id="startButton" onclick="startProcess()">
        بررسی اتصال سرویس
    </button>

    <div id="status">آماده شروع</div>

    <div class="note">
        این نسخه اتصال بک‌اند را آزمایش می‌کند.
        عملیات واقعی ترک کانال‌ها هنوز فعال نیست.
    </div>

</main>

<script>
async function startProcess() {

    const status = document.getElementById("status");
    const button = document.getElementById("startButton");

    button.disabled = true;
    status.textContent = "در حال اتصال به سرویس...";

    try {

        const response = await fetch(
            "https://rubika-cleaner-backend.onrender.com/health"
        );

        if (!response.ok) {
            throw new Error("خطای سرور");
        }

        const data = await response.json();

        if (data.status === "healthy") {

            status.textContent =
                "اتصال موفق است! بک‌اند فعال است.";

        } else {

            status.textContent =
                "وضعیت سرویس غیرمنتظره است.";

        }

    } catch (error) {

        status.textContent =
            "اتصال برقرار نشد. اینترنت و فیلترشکن را بررسی کنید.";

    } finally {

        button.disabled = false;

    }
}
</script>

</body>
</html>
