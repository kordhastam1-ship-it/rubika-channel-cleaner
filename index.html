
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مدیریت کانال‌های روبیکا</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:linear-gradient(135deg,#101827,#172d46);
color:white;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px
}
.container{
width:100%;
max-width:430px;
background:#1d2b40;
padding:25px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 35px #0005
}
.icon{font-size:50px}
h1{font-size:22px}
p{color:#bdcbe0;line-height:2;font-size:14px}
.card{
background:#263b54;
padding:15px;
border-radius:12px;
margin-top:15px
}
.number{font-size:28px;font-weight:bold;margin:8px}
.button{
width:100%;
padding:14px;
border:0;
border-radius:10px;
margin-top:15px;
background:#1689f8;
color:white;
font-size:16px;
font-weight:bold
}
.stop{background:#dc3545}
.button:disabled{opacity:.5}
.progress{
height:12px;
background:#101827;
border-radius:10px;
overflow:hidden;
margin-top:12px
}
#bar{
height:100%;
width:0;
background:#21c987;
transition:width .3s
}
#status{
margin-top:18px;
color:#8fd9ff;
font-size:14px;
line-height:2
}
.note{
font-size:12px;
color:#9aabc1;
margin-top:20px
}
</style>
</head>

<body>
<main class="container">

<div class="icon">🚀</div>
<h1>مدیریت کانال‌های روبیکا</h1>
<p>نسخه آزمایشی مدیریت کانال‌ها</p>

<div class="card">
تعداد کانال‌های آزمایشی
<div class="number" id="total">50</div>
</div>

<div class="card">
درصد پیشرفت
<div class="number" id="percent">0%</div>
<div class="progress">
<div id="bar"></div>
</div>
</div>

<button class="button" id="start" onclick="startDemo()">
شروع عملیات آزمایشی
</button>

<button class="button stop" id="stop" onclick="stopDemo()" disabled>
توقف عملیات
</button>

<div id="status">آماده شروع</div>

<div class="note">
این نسخه فقط شبیه‌سازی است و هیچ کانالی را ترک نمی‌کند.
</div>

</main>

<script>
let timer=null;
let progress=0;

function startDemo(){
if(timer!==null)return;

progress=0;

document.getElementById("start").disabled=true;
document.getElementById("stop").disabled=false;
document.getElementById("status").textContent=
"عملیات آزمایشی شروع شد...";

timer=setInterval(function(){
progress++;

document.getElementById("percent").textContent=
progress*2+"%";

document.getElementById("bar").style.width=
progress*2+"%";

document.getElementById("total").textContent=
50-progress;

if(progress>=50){
clearInterval(timer);
timer=null;

document.getElementById("start").disabled=false;
document.getElementById("stop").disabled=true;
document.getElementById("status").textContent=
"عملیات آزمایشی با موفقیت تمام شد!";
}
},200);
}

function stopDemo(){
if(timer!==null){
clearInterval(timer);
timer=null;
}

document.getElementById("start").disabled=false;
document.getElementById("stop").disabled=true;
document.getElementById("status").textContent=
"عملیات آزمایشی متوقف شد.";
}
</script>

</body>
</html>
