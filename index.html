<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدیریت کانال‌های روبیکا</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #10152f, #202d55, #10152f);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 430px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.13);
    border-radius: 25px;
    padding: 25px 20px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
}

.logo {
    width: 75px;
    height: 75px;
    margin: 0 auto 15px;
    background: linear-gradient(135deg, #48d6ff, #5575ff);
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 35px;
}

h1 {
    font-size: 22px;
    margin: 10px 0;
}

.subtitle {
    color: #c4cce5;
    font-size: 13px;
    line-height: 2;
    margin-bottom: 25px;
}

label {
    display: block;
    text-align: right;
    margin: 14px 0 8px;
    font-size: 13px;
    color: #d9e2ff;
}

input {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(0,0,0,0.2);
    color: white;
    font-size: 15px;
    outline: none;
    direction: ltr;
    text-align: left;
}

button {
    width: 100%;
    border: none;
    padding: 14px;
    border-radius: 13px;
    margin-top: 14px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.primary {
    background: linear-gradient(135deg, #42d5ff, #5976ff);
    color: #07132f;
}

.secondary {
    background: rgba(255,255,255,0.1);
    color: white;
    border: 1px solid rgba(255,255,255,0.12);
}

.danger {
    background: #e83d58;
    color: white;
}

.hidden {
    display: none !important;
}

.status {
    margin-top: 18px;
    font-size: 13px;
    color: #cbd6f5;
    line-height: 2;
    overflow-wrap: anywhere;
}

.counter-area {
    margin: 25px auto;
    width: 210px;
    height: 210px;
    position: relative;
}

.counter-area svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
}

.track {
    fill: none;
    stroke: rgba(255,255,255,0.1);
    stroke-width: 10;
}

.progress {
    fill: none;
    stroke: #47d9ff;
    stroke-width: 10;
    stroke-linecap: round;
    stroke-dasharray: 565.49;
    stroke-dashoffset: 565.49;
    transition: stroke-dashoffset 0.3s linear;
}

.counter-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.counter-number {
    font-size: 38px;
    font-weight: bold;
}

.counter-label {
    color: #cbd6f5;
    font-size: 13px;
    margin-top: 8px;
}

.info {
    background: rgba(0,0,0,0.15);
    border-radius: 13px;
    padding: 13px;
    margin-top: 12px;
    font-size: 13px;
    line-height: 2;
}

.footer {
    margin-top: 20px;
    color: #9caacd;
    font-size: 11px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">✈️</div>

    <h1>مدیریت کانال‌های روبیکا</h1>

    <div class="subtitle">
        مدیریت کانال‌ها در محیطی ساده و زیبا
    </div>

    <section id="loginSection">

        <label for="phone">شماره تلفن</label>
        <input id="phone" type="tel"
               placeholder="شماره تلفن"
               autocomplete="tel">

        <button class="primary" id="sendCodeBtn" onclick="sendCode()">
            دریافت کد ورود
        </button>

        <div id="codeSection" class="hidden">

            <label for="code">کد تأیید ارسال‌شده</label>
            <input id="code" type="text"
                   placeholder="کد تأیید"
                   autocomplete="one-time-code">

            <button class="primary" id="verifyBtn" onclick="verifyCode()">
                تأیید و ورود
            </button>

        </div>

        <div id="loginStatus" class="status"></div>

    </section>

    <section id="mainSection" class="hidden">

        <div class="info">
            برای شروع، دکمه زیر را بزن.
            عملیات فقط روی حسابی انجام می‌شود که وارد آن شده‌ای.
        </div>

        <button class="primary" id="startBtn" onclick="startLeaving()">
            🚀 شروع ترک کانال‌ها
        </button>

        <div class="counter-area">

            <svg viewBox="0 0 200 200">
                <circle class="track"
                        cx="100" cy="100" r="90"></circle>

                <circle class="progress"
                        id="progressCircle"
                        cx="100" cy="100" r="90"></circle>
            </svg>

            <div class="counter-text">
                <div class="counter-number" id="counter">0</div>
                <div class="counter-label">از <span id="total">0</span> کانال</div>
            </div>

        </div>

        <div class="info" id="operationStatus">
            آماده شروع
        </div>

        <button class="danger hidden" id="stopBtn" onclick="stopLeaving()">
            ⛔ توقف عملیات
        </button>

        <button class="secondary" onclick="logout()">
            خروج از حساب
        </button>

    </section>

    <div class="footer">
        مدیریت کانال‌های روبیکا
    </div>

</div>

<script>
const API = "https://rubika-cleaner.onrender.com";

let operationTimer = null;
let operationRunning = false;
let currentCount = 0;
let totalCount = 0;
let pollTimer = null;

async function apiRequest(path, data) {
    const response = await fetch(API + path, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
    });

    const result = await response.json();

    if (!response.ok) {
        throw new Error(
            result.detail || result.message || "خطا در ارتباط با سرور"
        );
    }

    return result;
}

function showStatus(elementId, message) {
    document.getElementById(elementId).textContent = message;
}

async function sendCode() {
    const phone = document.getElementById("phone").value.trim();

    if (!phone) {
        showStatus("loginStatus", "لطفاً شماره تلفن را وارد کن.");
        return;
    }

    const btn = document.getElementById("sendCodeBtn");
    btn.disabled = true;

    showStatus("loginStatus", "در حال ارسال درخواست...");

    try {
        const result = await apiRequest("/api/auth/send-code", {
            phone: phone
        });

        document.getElementById("codeSection").classList.remove("hidden");

        showStatus(
            "loginStatus",
            result.message || "اگر درخواست موفق بوده، کد تأیید را وارد کن."
        );

    } catch (error) {
        showStatus("loginStatus", "خطا: " + error.message);
    } finally {
        btn.disabled = false;
    }
}

async function verifyCode() {
    const phone = document.getElementById("phone").value.trim();
    const code = document.getElementById("code").value.trim();

    if (!phone || !code) {
        showStatus("loginStatus", "شماره تلفن و کد تأیید را وارد کن.");
        return;
    }

    /*
      این مسیر باید با مسیر واقعی تأیید کد در بک‌اند هماهنگ باشد.
      اگر بک‌اند تو مسیر دیگری دارد، باید همین قسمت اصلاح شود.
    */

    const btn = document.getElementById("verifyBtn");
    btn.disabled = true;

    showStatus("loginStatus", "در حال بررسی کد...");

    try {
        const result = await apiRequest("/api/auth/verify-code", {
            phone: phone,
            code: code
        });

        if (result.success === false) {
            throw new Error(result.message || "تأیید کد ناموفق بود.");
        }

        document.getElementById("loginSection").classList.add("hidden");
        document.getElementById("mainSection").classList.remove("hidden");

        showStatus("operationStatus", "ورود انجام شد. آماده شروع هستی.");

    } catch (error) {
        showStatus("loginStatus", "خطا: " + error.message);
    } finally {
        btn.disabled = false;
    }
}

function updateCounter(count, total) {
    currentCount = Math.max(0, Number(count) || 0);
    totalCount = Math.max(0, Number(total) || 0);

    document.getElementById("counter").textContent = currentCount;
    document.getElementById("total").textContent = totalCount;

    const circumference = 565.49;
    let ratio = totalCount > 0 ? currentCount / totalCount : 0;

    ratio = Math.max(0, Math.min(1, ratio));

    document.getElementById("progressCircle").style.strokeDashoffset =
        circumference * (1 - ratio);
}

async function startLeaving() {
    if (operationRunning) return;

    operationRunning = true;

    document.getElementById("startBtn").disabled = true;
    document.getElementById("stopBtn").classList.remove("hidden");

    updateCounter(0, 0);

    showStatus("operationStatus", "در حال شروع عملیات...");

    try {
        /*
          این مسیر باید در بک‌اند پیاده‌سازی شده باشد.
          فرانت‌اند به‌تنهایی نمی‌تواند کانال‌های روبیکا را ترک کند.
        */

        const result = await apiRequest("/api/channels/leave", {
            action: "start"
        });

        if (result.total !== undefined) {
            updateCounter(0, result.total);
        }

        showStatus(
            "operationStatus",
            result.message || "عملیات شروع شد."
        );

        pollProgress();

    } catch (error) {
        operationRunning = false;
        document.getElementById("startBtn").disabled = false;
        document.getElementById("stopBtn").classList.add("hidden");

        showStatus("operationStatus", "خطا: " + error.message);
    }
}

async function pollProgress() {
    if (!operationRunning) return;

    try {
        /*
          این مسیر باید وضعیت واقعی عملیات را از بک‌اند برگرداند.
        */

        const response = await fetch(API + "/api/channels/progress");

        if (!response.ok) {
            throw new Error("دریافت وضعیت ناموفق بود.");
        }

        const result = await response.json();

        updateCounter(
            result.completed ?? result.count ?? 0,
            result.total ?? 0
        );

        if (result.message) {
            showStatus("operationStatus", result.message);
        }

        if (
            result.done === true ||
            (totalCount > 0 && currentCount >= totalCount)
        ) {
            operationRunning = false;

            document.getElementById("startBtn").disabled = false;
            document.getElementById("stopBtn").classList.add("hidden");

            showStatus("operationStatus", "عملیات به پایان رسید.");
            return;
        }

    } catch (error) {
        showStatus("operationStatus", "در انتظار دریافت وضعیت از سرور...");
    }

    if (operationRunning) {
        pollTimer = setTimeout(pollProgress, 1000);
    }
}

async function stopLeaving() {
    if (!operationRunning) return;

    try {
        await apiRequest("/api/channels/stop", {
            action: "stop"
        });
    } catch (error) {
        showStatus(
            "operationStatus",
            "درخواست توقف ارسال نشد: " + error.message
        );
        return;
    }

    operationRunning = false;

    clearTimeout(pollTimer);

    document.getElementById("startBtn").disabled = false;
    document.getElementById("stopBtn").classList.add("hidden");

    showStatus("operationStatus", "درخواست توقف ارسال شد.");
}

function logout() {
    if (operationRunning) {
        showStatus(
            "operationStatus",
            "ابتدا عملیات را متوقف کن."
        );
        return;
    }

    document.getElementById("mainSection").classList.add("hidden");
    document.getElementById("loginSection").classList.remove("hidden");

    document.getElementById("code").value = "";
    document.getElementById("codeSection").classList.add("hidden");

    showStatus("loginStatus", "");
}
</script>

</body>
    </html>
