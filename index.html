<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مدیریت کانال‌های روبیکا</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 20px;
    font-family: Tahoma, Arial, sans-serif;
    background: #f1f4f9;
    color: #222;
}

.box {
    max-width: 420px;
    margin: 30px auto;
    padding: 24px;
    background: white;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 5px 20px #00000012;
}

h2 { color: #2879e8; }

input {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    border: 1px solid #ccd5df;
    border-radius: 10px;
    font-size: 16px;
    text-align: center;
    font-family: inherit;
}

button {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 15px;
    margin-top: 10px;
    font-size: 16px;
    font-family: inherit;
    cursor: pointer;
}

button:disabled {
    opacity: .55;
    cursor: not-allowed;
}

.primary { background: #2879e8; color: white; }
.danger { background: #e53935; color: white; }
.secondary { background: #555; color: white; }

.hidden { display: none !important; }

#message {
    margin: 20px 0;
    line-height: 2;
    overflow-wrap: anywhere;
}

.total {
    margin: 20px 0;
    padding: 20px;
    background: #edf5ff;
    border-radius: 14px;
}

.number {
    font-size: 38px;
    font-weight: bold;
    color: #2879e8;
    margin-top: 10px;
}

.progress-bg {
    height: 13px;
    background: #e5e5e5;
    border-radius: 20px;
    overflow: hidden;
    margin: 18px 0;
}

#progress {
    width: 0%;
    height: 100%;
    background: #24b36b;
    transition: width .3s;
}

.details {
    font-size: 14px;
    line-height: 2.2;
    color: #555;
}

.notice {
    margin-top: 15px;
    font-size: 12px;
    color: #777;
    line-height: 1.8;
}
</style>
</head>

<body>
<div class="box">

<h2>مدیریت کانال‌های روبیکا</h2>

<section id="loginSection">
    <h3>ورود به حساب روبیکا</h3>

    <input
        id="phone"
        type="tel"
        inputmode="tel"
        autocomplete="tel"
        placeholder="شماره موبایل"
    >

    <button id="sendButton" class="primary" onclick="sendCode()">
        دریافت کد ورود
    </button>

    <div id="codeSection" class="hidden">
        <input
            id="code"
            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="8"
            placeholder="کد تأیید روبیکا"
        >

        <button id="verifyButton" class="primary" onclick="verifyCode()">
            تأیید کد و ورود
        </button>
    </div>
</section>

<section id="channelsSection" class="hidden">

    <div class="total">
        تعداد کل کانال‌ها
        <div class="number" id="total">۰</div>
    </div>

    <button class="primary" onclick="loadStatus()">
        بررسی کانال‌ها
    </button>

    <button id="start" class="danger" onclick="startLeaving()" disabled>
        🚀 شروع ترک کانال‌ها
    </button>

    <div class="progress-bg">
        <div id="progress"></div>
    </div>

    <div class="details">
        پیشرفت: <span id="done">۰</span> از <span id="all">۰</span>
        <br>
        درصد پیشرفت: <span id="percent">۰</span>٪
        <br>
        کانال‌های باقی‌مانده: <span id="remaining">۰</span>
    </div>

    <button id="stop" class="secondary hidden" onclick="stopLeaving()">
        ⛔ توقف عملیات
    </button>

</section>

<div id="message" role="status" aria-live="polite">
    شماره موبایل خودت را وارد کن.
</div>

<p class="notice">
کد ورود را فقط در سایت خودت وارد کن و برای هیچ‌کس نفرست.
</p>

</div>

<script>
const API = "https://rubika-cleaner-backend.onrender.com";

let sessionToken = "";
let totalChannels = 0;
let running = false;
let timer = null;

function message(text) {
    document.getElementById("message").textContent = text;
}

async function request(path, method, body = null) {
    const headers = {};

    if (body !== null) {
        headers["Content-Type"] = "application/json";
    }

    if (sessionToken) {
        headers["X-Session-Token"] = sessionToken;
    }

    const options = {
        method: method,
        headers: headers
    };

    if (body !== null) {
        options.body = JSON.stringify(body);
    }

    const response = await fetch(API + path, options);

    let data;

    try {
        data = await response.json();
    } catch {
        throw new Error("پاسخ سرور قابل خواندن نیست.");
    }

    if (!response.ok) {
        throw new Error(data.detail || "درخواست ناموفق بود.");
    }

    return data;
}

async function sendCode() {
    const phone = document.getElementById("phone").value.trim();
    const button = document.getElementById("sendButton");

    if (!phone) {
        message("ابتدا شماره موبایل را وارد کن.");
        return;
    }

    button.disabled = true;
    message("در حال درخواست کد ورود...");

    try {
        const data = await request(
            "/api/auth/send-code",
            "POST",
            { phone: phone }
        );

        if (!data.token) {
            throw new Error("سرور توکن درخواست را برنگرداند.");
        }

        sessionToken = data.token;
        document.getElementById("codeSection").classList.remove("hidden");

        message(data.message || "اگر روبیکا کد ارسال کرده، آن را وارد کن.");
    } catch (error) {
        message("خطا: " + error.message);
    } finally {
        button.disabled = false;
    }
}

async function verifyCode() {
    const code = document.getElementById("code").value.trim();
    const button = document.getElementById("verifyButton");

    if (!sessionToken) {
        message("درخواست ورود معتبر نیست؛ دوباره کد بگیر.");
        return;
    }

    if (!code) {
        message("کد تأیید را وارد کن.");
        return;
    }

    button.disabled = true;
    message("در حال تأیید کد و ورود به حساب...");

    try {
        const data = await request(
            "/api/auth/verify-code",
            "POST",
            {
                token: sessionToken,
                code: code
            }
        );

        if (!data.success) {
            throw new Error("ورود تأیید نشد.");
        }

        document.getElementById("loginSection").classList.add("hidden");
        document.getElementById("channelsSection").classList.remove("hidden");

        message("سرور ورود را تأیید کرد؛ در حال بررسی وضعیت نشست...");

        await loadStatus();

    } catch (error) {
        message("ورود ناموفق بود: " + error.message);
    } finally {
        button.disabled = false;
    }
}

async function loadStatus() {
    message("در حال بررسی اتصال و فهرست کانال‌ها...");

    try {
        const data = await request("/api/channels/status", "GET");

        totalChannels = Number(data.total_channels || 0);

        document.getElementById("total").textContent = totalChannels;
        document.getElementById("all").textContent = totalChannels;
        document.getElementById("remaining").textContent = totalChannels;

        const connected = data.connected === true;
        const loaded = data.channels_loaded === true;

        document.getElementById("start").disabled =
            !(connected && loaded && totalChannels > 0);

        message(data.message || "وضعیت کانال‌ها دریافت شد.");

    } catch (error) {
        document.getElementById("start").disabled = true;
        message("خطا در دریافت وضعیت کانال‌ها: " + error.message);
    }
}

async function startLeaving() {
    if (running) return;

    if (!sessionToken) {
        message("ابتدا وارد حساب شو.");
        return;
    }

    if (totalChannels === 0) {
        message("فهرست کانال‌ها خالی است یا هنوز دریافت نشده.");
        return;
    }

    try {
        const data = await request("/api/channels/leave/start", "POST", {});

        running = true;
        document.getElementById("start").disabled = true;
        document.getElementById("stop").classList.remove("hidden");

        message(data.message || "درخواست شروع عملیات ارسال شد.");

        timer = setInterval(checkProgress, 1500);

    } catch (error) {
        message("عملیات شروع نشد: " + error.message);
    }
}

async function checkProgress() {
    try {
        const data = await request("/api/channels/leave/status", "GET");

        const done = Number(data.done || 0);
        const total = Number(data.total || totalChannels);
        const percent = total > 0
            ? Math.min(100, Math.floor(done * 100 / total))
            : 0;

        document.getElementById("done").textContent = done;
        document.getElementById("all").textContent = total;
        document.getElementById("remaining").textContent =
            Math.max(0, total - done);
        document.getElementById("percent").textContent = percent;
        document.getElementById("progress").style.width = percent + "%";

        if (data.status === "completed") {
            finish("ترک کانال‌ها به پایان رسید.");
        } else if (data.status === "stopped") {
            finish("عملیات متوقف شد.");
        } else if (data.status === "error") {
            finish(data.message || "عملیات با خطا متوقف شد.");
        }
    } catch (error) {
        message("خطا در دریافت پیشرفت: " + error.message);
    }
}

async function stopLeaving() {
    try {
        const data = await request("/api/channels/leave/stop", "POST", {});
        finish(data.message || "درخواست توقف ارسال شد.");
    } catch (error) {
        message("توقف عملیات ناموفق بود: " + error.message);
    }
}

function finish(text) {
    running = false;

    if (timer) {
        clearInterval(timer);
        timer = null;
    }

    document.getElementById("start").disabled = false;
    document.getElementById("stop").classList.add("hidden");
    message(text);
}
</script>

</body>
    </html>
