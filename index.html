<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ترک کانال‌های روبیکا</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #101827, #172d46);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: #1d2b40;
            padding: 28px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 35px #0005;
        }

        .icon {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 23px;
            margin-bottom: 12px;
        }

        p {
            color: #bdcbe0;
            line-height: 2;
            font-size: 14px;
        }

        .button {
            display: block;
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 15px;
            margin-top: 22px;
            background: #1689f8;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .button:hover {
            background: #0874db;
        }

        #status {
            margin-top: 18px;
            font-size: 13px;
            color: #8fd9ff;
            line-height: 2;
        }

        .note {
            font-size: 12px;
            color: #9aabc1;
            margin-top: 22px;
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="icon">🚀</div>

        <h1>مدیریت کانال‌های روبیکا</h1>

        <p>
            به ابزار مدیریت کانال‌های روبیکا خوش آمدید.
            برای شروع، روی دکمه زیر بزنید.
        </p>

        <button class="button" onclick="startProcess()">
            شروع ترک کانال‌ها
        </button>

        <div id="status">
            آماده شروع
        </div>

        <div class="note">
            این نسخه نمایشی است و هنوز به حساب روبیکا متصل نیست.
        </div>
    </main>

    <script>
        function startProcess() {
            document.getElementById("status").textContent =
                "برای اجرای عملیات، ابتدا باید سرویس اجرایی متصل شود.";
        }
    </script>
</body>
  </html>
