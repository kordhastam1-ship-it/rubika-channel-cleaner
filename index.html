<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مدیریت کانال‌های روبیکا</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:linear-gradient(135deg,#101827,#172d46);
color:white;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px
}
.container{
width:100%;
max-width:430px;
background:#1d2b40;
padding:25px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 35px #0005
}
.icon{font-size:50px}
h1{font-size:22px}
p{color:#bdcbe0;line-height:2;font-size:14px}
.card{
background:#263b54;
padding:15px;
border-radius:12px;
margin-top:15px
}
.number{font-size:25px;font-weight:bold;margin:10px}
.button{
width:100%;
padding:14px;
border:0;
border-radius:10px;
margin-top:15px;
background:#1689f8;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer
}
.button:disabled{opacity:.5;cursor:not-allowed}
#status{
margin-top:18px;
color:#8fd9ff;
font-size:14px;
line-height:2;
overflow-wrap:anywhere
}
.note{
font-size:12px;
color:#9aabc1;
margin-top:20px;
line-height:2
}
</style>
</head>

<body>
<main class="container">

<div class="icon">🚀</div>
<h1>مدیریت کانال‌های روبیکا</h1>
<p>سامانه مدیریت کانال‌ها</p>

<div class="card">
وضعیت سرور
<div class="number" id="server">در حال بررسی...</div>
</div>

<div class="card">
وضعیت کتابخانه Rubpy
<div class="number" id="rubpy">در حال بررسی...</div>
</div>

<div class="card">
تعداد کانال‌های حساب
<div class="number" id="total">هنوز دریافت نشده</div>
</div>

<button class="button" id="check" onclick="checkServer()">
بررسی اتصال سرور
</button>

<div id="status">در حال بررسی وضعیت سرویس...</div>

<div class="note">
در این مرحله هنوز حساب روبیکا متصل نشده است.
برای حفاظت از حساب، اطلاعات ورود خود را در این صفحه وارد نکنید.
</div>

</main>

<script>
const API = "https://rubika-cleaner-backend.onrender.com";

async function checkServer(){
const button = document.getElementById("check");
const status = document.getElementById("status");

button.disabled = true;
status.textContent = "در حال ارتباط با سرور...";

document.getElementById("server").textContent = "در حال بررسی...";
document.getElementById("rubpy").textContent = "در حال بررسی...";

try {
const healthResponse = await fetch(API + "/health");
if (!healthResponse.ok) {
throw new Error("سرور پاسخ موفق نداد");
}

const health = await healthResponse.json();

if (health.status !== "healthy") {
throw new Error("وضعیت سلامت سرور نامعتبر است");
}

document.getElementById("server").textContent = "فعال ✅";

const systemResponse = await fetch(API + "/api/system/check");
if (!systemResponse.ok) {
throw new Error("بررسی کتابخانه ناموفق بود");
}

const system = await systemResponse.json();

document.getElementById("rubpy").textContent =
system.rubpy_installed
? "نصب است - نسخه " + system.rubpy_version
: "نصب نیست";

const channelResponse = await fetch(API + "/api/channels/status");
if (!channelResponse.ok) {
throw new Error("دریافت وضعیت کانال‌ها ناموفق بود");
}

const channels = await channelResponse.json();

document.getElementById("total").textContent =
channels.channels_loaded
? channels.total_channels
: "هنوز دریافت نشده";

status.textContent = channels.message ||
"ارتباط با سرور برقرار شد.";

} catch (error) {
document.getElementById("server").textContent = "خطا ❌";
document.getElementById("rubpy").textContent = "بررسی نشد";
document.getElementById("total").textContent = "دریافت نشده";
status.textContent =
"اتصال برقرار نشد. دوباره امتحان کن. اگر مشکل ادامه داشت، وضعیت سرور را بررسی می‌کنیم.";
} finally {
button.disabled = false;
}
}

checkServer();
</script>

</body>
  </html>
